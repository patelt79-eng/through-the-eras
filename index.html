<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Through the Eras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: console-style career mode — big slanted menu bars under a club-coloured HUD, panels on a floodlit-night pitch ground. Single dark look by choice. */
:root{
  --ground:#0D1A20; --panel:#14252D; --panel2:#1A3039; --line:#27414B;
  --text:#ECF2F3; --muted:#93A9B1; --gold:#F2B544; --win:#3FBF7F; --loss:#E5574D; --draw:#C9A63A;
  --club:#2E6F8E; --club2:#F2B544;
  --f-display:'Saira Condensed','Arial Narrow',Impact,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--text)}
body{font:15px/1.45 var(--f-body);min-height:100vh;background:
  radial-gradient(1200px 500px at 50% -200px, color-mix(in srgb, var(--club) 26%, transparent), transparent 70%),
  repeating-linear-gradient(90deg, transparent 0 80px, rgba(255,255,255,.012) 80px 160px), var(--ground)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
#app{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.02em}
.h1{font-size:clamp(30px,5vw,46px);font-weight:800;text-transform:uppercase;font-style:italic}
h2{font-size:19px;font-weight:700;text-transform:uppercase}
h3{font-size:16px;text-transform:uppercase;color:var(--gold);margin-top:14px}
.lede{color:var(--muted);font-size:17px;max-width:62ch;margin:6px 0 18px}
.sub{color:var(--muted);font-size:13.5px;margin:6px 0}
.fine{color:var(--muted);font-size:12.5px;max-width:70ch;margin-top:28px}
.dim{color:var(--muted)} .b{font-weight:700} .num{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic;margin:8px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;transition:background .15s,transform .1s}
.btn:hover{background:#21404b}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);color:#1c1405;border-color:var(--gold)} .btn.primary:hover{background:#ffc75e}
.btn.danger{border-color:var(--loss);color:#ffb3ad}
.btn.big{font-size:19px;padding:12px 26px} .btn.sm{padding:4px 10px;font-size:13px}
.lnk{color:var(--gold);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.back{color:var(--muted);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 10px}
.formrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.formrow.center{justify-content:center}
.seg{padding:6px 12px;border:1px solid var(--line);border-radius:3px;font-weight:600;font-size:13.5px;background:var(--panel)}
.seg.on{background:var(--club);border-color:var(--club2);color:#fff;box-shadow:inset 0 -3px 0 var(--club2)}
input,select{background:#0f2027;color:var(--text);border:1px solid var(--line);border-radius:3px;padding:8px 10px;font:inherit;max-width:100%}
label{font-size:13px;color:var(--muted);display:block;margin-top:8px}
.chk{display:inline-flex;gap:6px;align-items:center;margin:0}
/* title */
.title{padding-top:min(8vh,60px)}
.brand{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 28px;margin-bottom:26px}
.logo{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:clamp(46px,9vw,92px);line-height:.86;letter-spacing:-.01em;background:linear-gradient(100deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;transform:skewX(-6deg)}
.brand p{color:var(--muted);max-width:30ch;margin:0 0 8px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{position:relative;min-height:150px;text-align:left;padding:18px 20px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform .15s,border-color .15s}
.tile.big{min-height:230px}
.tile:hover:not([aria-disabled="true"]){transform:translateY(-3px);border-color:var(--gold)}
.tile .tl{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;font-style:italic;line-height:1}
.tile .ts{color:var(--muted);font-size:14px}
.tile .ti{position:absolute;right:16px;top:14px;width:90px;height:90px;fill:none;stroke:color-mix(in srgb,var(--gold) 70%,#fff);stroke-width:2.4;stroke-linecap:round;opacity:.85}
.tile.locked{filter:saturate(.3)}
/* flow */
.flow.narrow{max-width:760px}
.eras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.era{text-align:left;padding:20px;border-radius:4px;min-height:240px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);position:relative}
.era .eh{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.era .eb{font-size:14.5px;flex:1}
.e92{background:#e9e1cc;color:#2a241a;font-family:Georgia,'Times New Roman',serif;border-color:#bfb393}
.e92 .eh{font-family:Georgia,serif;font-style:italic;border-bottom:3px double #2a241a;padding-bottom:4px}
.e04{background:linear-gradient(180deg,#1d3f8f,#0d2152);color:#e8eeff;border-color:#4b6fd1}
.e04 .eh{font-family:Verdana,Tahoma,sans-serif;font-weight:700;letter-spacing:-.03em;text-shadow:0 2px 0 #000}
.e22{background:linear-gradient(140deg,#3a1257,#0b2a3c 70%);border-color:var(--gold);transition:transform .15s}
.e22:hover{transform:translateY(-3px)}
.era .lock{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.era .go{font-family:var(--f-display);font-weight:700;text-transform:uppercase;color:var(--gold);font-size:18px}
.era.locked{opacity:.75}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.clubcard{position:relative;text-align:left;padding:14px 14px 12px 58px;background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;gap:2px;min-height:112px;transition:border-color .15s,transform .15s}
.clubcard:hover{border-color:var(--c1);transform:translateY(-2px)}
.clubcard .kit{position:absolute;left:12px;top:14px;width:34px;height:40px;background:linear-gradient(90deg,var(--c1) 0 70%,var(--c2) 70%);clip-path:polygon(22% 0,78% 0,100% 18%,88% 34%,82% 30%,82% 100%,18% 100%,18% 30%,12% 34%,0 18%);}
.cn{font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.05}
.cm,.ce{font-size:12.5px;color:var(--muted)} .cr{font-size:13px} .cr b{color:var(--gold);font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ccard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.ccard .band{position:absolute;inset:0 auto 0 0;width:6px;background:linear-gradient(var(--c1),var(--c2))}
.ccard b{font-family:var(--f-display);font-size:22px;text-transform:uppercase;font-style:italic}
.ccard span{color:var(--muted)}
.mgrpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:8px}
.mcard b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.realm{font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--gold);font-style:italic}
.mcard .btn{align-self:flex-start;margin-top:auto}
/* hud + bars */
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:10px 0}
.hudl{display:flex;gap:12px;align-items:center}
.crest{width:38px;height:44px;background:linear-gradient(135deg,var(--c1) 0 60%,var(--c2) 60%);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.hc{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.hm{color:var(--muted);font-size:13px}
.hudr{display:flex;gap:18px}.hudr div{display:flex;flex-direction:column;align-items:flex-end}.hudr span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.hudr b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:4px 0 14px;padding:6px 2px;align-items:stretch}
.bars::-webkit-scrollbar{display:none}
.bar{position:relative;flex:0 0 auto;padding:12px 18px;font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.05em;background:linear-gradient(180deg,#22404a,#162b33);border:1px solid var(--line);transform:skewX(-10deg);color:#cfe0e4;transition:background .15s}
.bar:hover{background:#2a4c57}
.bar.on{background:linear-gradient(180deg,color-mix(in srgb,var(--club) 85%,#fff 15%),var(--club));color:#fff;border-color:var(--club2);box-shadow:inset 0 -4px 0 var(--club2);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.bar em{position:absolute;top:-6px;right:-4px;background:var(--loss);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 6px;transform:skewX(10deg)}
.pad{flex:0 0 auto;align-self:center;font-family:var(--f-display);font-size:12px;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:1px 6px}
/* panels */
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid > *{min-width:0}
.grid .wide,.grid .onboard{grid-column:1/-1}
.grid.tf{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .grid.tf .wide{grid-column:auto}
.grid.tablev{grid-template-columns:minmax(0,2fr) minmax(0,1fr)} .grid.tablev .wide{grid-column:auto}
.grid.tac{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:4px;padding:14px 16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:3px}
.tag.open{color:var(--win);border-color:var(--win)} .tag.shut{color:var(--muted)}
.onboard{border-color:var(--gold);background:linear-gradient(90deg,color-mix(in srgb,var(--gold) 9%,var(--panel)),var(--panel))}
.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.steps button{width:100%;text-align:left;display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.steps button:hover{border-color:var(--gold)}
.steps small{display:block;color:var(--muted);font-size:12.5px}
.steps .tick{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700}
.steps .done .tick{background:var(--win);border-color:var(--win);color:#06200f}
.steps .done b{text-decoration:line-through;opacity:.7}
.next{position:relative;overflow:hidden}
.next::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:linear-gradient(135deg,var(--c1),var(--c2));opacity:.18;transform:rotate(20deg)}
.vs{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-size:24px;text-transform:uppercase;margin:6px 0}
.vs div{display:flex;gap:8px;align-items:center} .vs > span{color:var(--muted);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:2px 7px 2px 3px;border-radius:3px;background:#0c1b21;border:1px solid var(--line);vertical-align:middle}
.chip i{width:12px;height:14px;background:linear-gradient(90deg,var(--c1) 0 60%,var(--c2) 60%);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.chip.sm{font-size:10.5px;padding:1px 5px 1px 2px}.chip.sm i{width:9px;height:11px}
.chip.ext{padding:2px 7px}
.fm{display:inline-block;width:18px;text-align:center;font-size:11px;font-weight:700;border-radius:2px;margin-right:2px;color:#091512}
.fm.W{background:var(--win)}.fm.L{background:var(--loss);color:#fff}.fm.D{background:var(--draw)}
.meter{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;margin:8px 0;font-size:13.5px}
.mt{height:8px;background:#0b171c;border-radius:4px;overflow:hidden}.mt i{display:block;height:100%}
.meter.good i{background:var(--win)}.meter.mid i{background:var(--draw)}.meter.bad i{background:var(--loss)}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.inbox{list-style:none;margin:0;padding:0}
.inbox li button{width:100%;text-align:left;display:flex;gap:10px;align-items:baseline;padding:8px 6px;border-bottom:1px solid var(--line)}
.inbox li button:hover{background:var(--panel2)}
.inbox .md{color:var(--muted);font-size:12px;flex:0 0 46px;font-variant-numeric:tabular-nums}
.inbox b{font-weight:500;flex:1}.inbox .unread b{font-weight:700}
.inbox em{font-style:normal;font-size:11px;background:var(--gold);color:#1c1405;padding:1px 6px;border-radius:3px;font-weight:700;text-transform:uppercase}
.inbox .k-offer b::before{content:"£ ";color:var(--gold)}
/* feed */
.feed{list-style:none;margin:0;padding:0}
.post{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.post > div{min-width:0;flex:1}
.av{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,var(--c1,#3a5865),var(--c2,#1d2d33));color:#fff;text-shadow:0 1px 2px #000}
.post.insider .av{background:#2b2b2b;border:2px solid var(--gold)} .post.pundit .av{background:#5b3a8c} .post.league .av{background:#3d195b} .post.fan .av{background:#3b4f57}
.pw{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;font-size:13px}.pw span{color:var(--muted)}
.vf{color:#4aa3ff;font-size:11px}
.post p{margin:3px 0;overflow-wrap:anywhere}.post.big p{font-weight:600}
.pl{font-size:12px;color:var(--muted)}
/* tables */
.tscroll{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:12.5px;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:6px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
.tbl tbody tr[data-act]{cursor:pointer}.tbl tbody tr[data-act]:hover{background:var(--panel2)}
.tbl tr.me td{background:color-mix(in srgb,var(--club) 22%,transparent);font-weight:700}
.tbl.mini td{padding:4px 6px}
.league tr.ucl td:first-child{box-shadow:inset 3px 0 #4aa3ff}.league tr.uel td:first-child{box-shadow:inset 3px 0 #f28c28}.league tr.rel td:first-child{box-shadow:inset 3px 0 var(--loss)}
.legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.lg{width:10px;height:10px;display:inline-block}.lg.ucl{background:#4aa3ff}.lg.uel{background:#f28c28}.lg.rel{background:var(--loss)}
.sort{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}.sort.on{color:var(--gold)}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:15px;padding:1px 4px;border-radius:2px;color:#111}
.r-elite{background:linear-gradient(135deg,#e6f1ff,#9ec7ff)}.r-gold{background:linear-gradient(135deg,#ffe28a,#d9a520)}.r-silver{background:linear-gradient(135deg,#eef2f4,#a9b6bc)}.r-bronze{background:linear-gradient(135deg,#f0bf8f,#b27242)}.r-low{background:#5d6f76;color:#e8eef0}
.pos{display:inline-block;min-width:30px;text-align:center;font-size:11.5px;font-weight:700;padding:1px 4px;border-radius:2px;color:#0b1a1f}
.p-GK{background:#f2c94c}.p-DEF{background:#56ccf2}.p-MID{background:#6fcf97}.p-FWD{background:#ff8a80}
.ar{font-size:11px;color:var(--muted)}.ar.up,.ar.up2{color:var(--win)}.ar.dn,.ar.dn2{color:var(--loss)}
.xi{font-size:10px;background:var(--club);border:1px solid var(--club2);color:#fff;padding:0 4px;margin-left:6px;border-radius:2px;vertical-align:middle}
.hist{font-size:10px;color:var(--gold);border:1px solid var(--gold);padding:0 4px;margin-left:6px;border-radius:2px;text-transform:uppercase;vertical-align:middle}
.st{font-size:11.5px;padding:1px 6px;border-radius:2px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.st.inj{border-color:var(--loss);color:#ffb3ad}.st.ban{border-color:var(--draw)}.st.sad{border-color:#b98cff}.st.ok{border-color:var(--win);color:#9ff0c6}.st.bad{border-color:var(--loss)}
/* pitch */
.pitch{position:relative;aspect-ratio:68/80;max-width:100%;background:repeating-linear-gradient(0deg,#1f6e3f 0 10%,#22783f 10% 20%);border:2px solid rgba(255,255,255,.5);border-radius:3px;margin:10px 0;overflow:hidden}
.pitch::before{content:"";position:absolute;left:25%;right:25%;bottom:0;height:14%;border:2px solid rgba(255,255,255,.45);border-bottom:0}
.pitch::after{content:"";position:absolute;left:0;right:0;top:-1px;height:0;border-top:2px solid rgba(255,255,255,.45)}
.pitch.big{max-width:440px;margin-inline:auto}
.dot{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:78px;text-align:center}
.dot .dr{font-family:var(--f-display);font-weight:800;font-size:15px;min-width:34px;padding:2px 4px;border-radius:3px;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.dot .dn{font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);padding:0 4px;border-radius:2px;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot .ds{font-size:10px;color:#dfe;opacity:.8}
button.dot:hover .dr{outline:2px solid #fff}
.dot.sel .dr{outline:3px solid var(--gold)} .dot.oop .dr{outline:2px solid var(--loss)}
.plist{list-style:none;margin:0;padding:0}
.plist li button{width:100%;display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;flex-wrap:wrap}
.plist li button:hover{background:var(--panel2)} .plist li button.sel{background:color-mix(in srgb,var(--gold) 20%,transparent)}
.plist b{flex:1;min-width:110px;font-weight:600}
.plist.rank{counter-reset:r}.plist.rank li button::before{counter-increment:r;content:counter(r);font-family:var(--f-display);font-weight:800;color:var(--gold);width:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px}.filters input{flex:1;min-width:140px}
.deals{list-style:none;margin:0 0 12px;padding:0}.deals li{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.lb{margin:0;padding:0 0 0 20px}.lb li button{width:100%;display:flex;gap:8px;align-items:center;padding:4px 0;text-align:left}.lb b{flex:1;font-weight:600}.lb .num{font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:17px}
.results{list-style:none;margin:0;padding:0}.results li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.results li span{color:var(--muted);flex:0 0 50px}
.results li.W b::before{content:"W ";color:var(--win)}.results li.L b::before{content:"L ";color:var(--loss)}.results li.D b::before{content:"D ";color:var(--draw)}
.notes{padding-left:18px;margin:6px 0}.notes li{margin:6px 0;max-width:70ch}
.report{background:linear-gradient(180deg,var(--panel),var(--panel)) padding-box;border-left:4px solid var(--gold)}
/* modal */

  // ---------- team selection ----------

  // ---------- match engine ----------

  // ---------- transfers ----------
  function askingPrice(p, buyer){
    const v=value(p); const c=p.c;

    const sq=clubPlayers(c).sort((a,b)=>b.r-a.r); const rank=sq.indexOf(p);

  function refuses(p, buyer){

  function interest(p, club, wage){

    // playing time
    const sq=clubPlayers(club).filter(x=>GROUP[x.p]===GROUP[p.p]).sort((a,b)=>b.r-a.r);
    const better=sq.filter(x=>x.r>p.r+2).length; const slots={GK:1,DEF:4,MID:3,FWD:3}[GROUP[p.p]];
    if (better>=slots) s-=0.25;

    if (age(p)>=31) s+=0.08;
    return clamp(s,0.03,0.97);

// SCOUT
function viewScout(){
  const s=S();
  if(!s.scoutRegion) return `<section class="panel"><div class="ph"><h2>Scouting network</h2></div><p class="sub">You haven't set up a scouting network yet.</p><button class="btn primary" data-act="step" data-k="scout">Set up scouting</button></section>`;
  const mine=E.clubPlayers(s.club);
  const kids=mine.filter(p=>E.age(p)<=21).sort((a,b)=>b.pot-a.pot).slice(0,3);
  const need=E.weakestGroup(s.club);
  const targets=s.ids.map(E.P).filter(p=>p.c!==s.club&&!p.loan&&E.scouted(p)&&E.GROUP[p.p]===need&&E.age(p)<=29).sort((a,b)=>E.ovr(b)-E.ovr(a)).filter(p=>E.askingPrice(p,s.club)<=s.budget[s.club]*1.2).slice(0,3);
  const abroadKids=s.ids.map(E.P).filter(p=>p.c!==s.club&&E.scouted(p)&&E.age(p)<=21&&!p.loan).sort((a,b)=>b.pot-a.pot).slice(0,5);
  const key=mine.slice().sort((a,b)=>b.r-a.r).slice(0,5);
  const inj=mine.filter(p=>p.inj);
  const row=(p,note)=>`<li><button data-act="player" data-id="${p.id}"><span class="pos p-${E.GROUP[p.p]}">${p.p}</span><b>${esc(p.fn)}</b><span class="dim">${note||''}</span><span class="ovr ${ratingClass(E.ovr(p))}">${E.ovr(p)}</span></button></li>`;
  return `<div class="grid scout">
  <section class="panel report"><div class="ph"><h2>Scout report</h2><span class="tag">${esc(s.scoutRegion)}</span></div><p class="sub">${E.fmtDate(s.date)} · prepared for ${esc(s.manager)}</p>
    <h3>Transfer targets · ${({GK:'goalkeeper',DEF:'defender',MID:'midfielder',FWD:'forward'})[need]}</h3><p class="sub">Your weakest area right now. Affordable within your budget.</p><ol class="plist rank">${targets.map(p=>row(p,`${p.c==='EXT'?p.fr:E.shortName(p.c)} · ${money(E.askingPrice(p,s.club))}`)).join('')||'<li class="empty">Nobody suitable in budget.</li>'}</ol>
    <h3>Key players</h3><ul class="plist">${key.map(p=>row(p,`${p.apps} apps, ${p.g} goals`)).join('')}</ul>
    <h3>Youngsters to look at</h3><ul class="plist">${kids.map(p=>row(p,`age ${E.age(p)}, potential ${p.pot}`)).join('')||'<li class="empty">No under-21s in the squad.</li>'}</ul>
    <h3>Injured players</h3><ul class="plist">${inj.map(p=>row(p,`${p.injName}, ${p.inj} days`)).join('')||'<li class="empty">Nobody injured.</li>'}</ul>
  </section>
  <section class="panel"><div class="ph"><h2>Wonderkids spotted</h2></div><p class="sub">Best young players your scouts can see.</p><ul class="plist">${abroadKids.map(p=>row(p,`${p.c==='EXT'?p.fr:E.shortName(p.c)} · age ${E.age(p)} · POT ${p.pot}`)).join('')}</ul>
    <button class="btn" data-act="step" data-k="scout">Change region</button></section>
  <section class="panel"><div class="ph"><h2>Send your scouts</h2></div><p class="sub">Ask for a report on a position. It takes a few days; the game will stop when it's ready. Up to two at a time.</p>
    <div class="formrow"><select id="scg" aria-label="Position">${[['GK','Goalkeepers'],['DEF','Defenders'],['MID','Midfielders'],['FWD','Forwards']].map(([v,l])=>`<option value="${v}" ${v===need?'selected':''}>${l}</option>`).join('')}</select><select id="sca" aria-label="Age">${[[40,'Any age'],[29,'29 or under'],[23,'23 or under'],[21,'21 or under']].map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="btn primary" data-act="scoutSend">Send scouts</button></div>
    ${(()=>{ const jobs=s.scoutJobs.filter(j=>!j.done); return jobs.length?`<ul class="deals">${jobs.map(j=>`<li><b>${j.region?`First report: ${esc(j.region)}`:esc({GK:'Goalkeepers',DEF:'Defenders',MID:'Midfielders',FWD:'Forwards'}[j.g])+(j.maxAge<40?` · ${j.maxAge} or under`:'')}</b><span class="st">Due ${E.fmtDate(j.due).slice(0,6)}</span></li>`).join('')}</ul>`:'<p class="empty">No scouts out right now.</p>'; })()}
  </section>
  </div>`;
}

function playerModal(id){

    <dl class="kv"><div><dt>Age</dt><dd>${a}${p.dob?` <small>(${E.fmtDate(p.dob)})</small>`:''}</dd></div><div><dt>Base rating</dt><dd>${p.r} ${arrow(p)}</dd></div><div><dt>Potential</dt><dd>${p.pot}</dd></div><div><dt>Value</dt><dd>${money(E.value(p))}</dd></div><div><dt>Wage</dt><dd>£${p.wage}k/wk</dd></div><div><dt>Contract</dt><dd>${p.ce}</dd></div><div><dt>Morale</dt><dd>${Math.round(p.morale)}</dd></div><div><dt>Fitness</dt><dd>${Math.round(p.fit)}%</dd></div>
    <div><dt>This season</dt><dd>${p.apps} apps · ${p.g} G · ${p.a} A${p.apps?` · avg ${(p.rs/p.apps).toFixed(2)}`:''}</dd></div><div><dt>2021/22 (PL)</dt><dd>${s21}</dd></div></dl>
    ${p.inj?`<p class="warn">Injured: ${esc(p.injName)}, back in ${p.inj} days.</p>`:''}
    ${p.rt&&p.c==='EXT'?`<p class="sub">In real life he joined ${esc(E.CLUBS[p.rt].name)} in the ${p.rw} window. History will repeat unless you sign him first.</p>`:''}

function msgModal(id){
  const s=S(); const m=s.inbox.find(x=>x.id===id); if(!m) return; m.read=true;
  let act='';
  if(m.action&&m.action.type==='bid'&&!m.done){ const p=E.P(m.action.pid); act=`<div class="formrow"><button class="btn primary" data-act="bidAccept" data-id="${id}">Accept £${m.action.fee}m</button><button class="btn" data-act="bidReject" data-id="${id}">Reject</button></div><div class="formrow"><input id="counter" type="number" step="0.5" value="${Math.round(m.action.fee*1.25*2)/2}"><button class="btn" data-act="bidCounter" data-id="${id}">Counter-offer</button></div><button class="lnk" data-act="player" data-id="${p.id}">View ${esc(p.n)}</button>`; }
  else if(m.action&&m.action.type==='scout'){ const ps=(m.action.ids||[]).map(E.P).filter(Boolean); if(ps.length) act=`<ul class="plist">${ps.map(p=>`<li><button data-act="player" data-id="${p.id}"><span class="pos p-${E.GROUP[p.p]}">${p.p}</span><b>${esc(p.fn)}</b><span class="dim">${esc(p.c==='EXT'?p.fr:E.shortName(p.c))} · ${E.age(p)}</span><span class="ovr ${ratingClass(E.ovr(p))}">${E.ovr(p)}</span></button></li>`).join('')}</ul>`; }
  else if(m.action&&m.action.type==='renew'&&!m.done){ act=`<div class="formrow"><button class="btn primary" data-act="msgRenew" data-id="${id}">Offer new contract</button><button class="btn" data-act="player" data-id="${m.action.pid}">View player</button></div>`; }
  else if(m.action&&m.action.type==='loan'&&!m.done){ act=`<div class="formrow"><button class="btn primary" data-act="msgLoan" data-id="${id}">Loan him out</button><button class="btn" data-act="msgKeep" data-id="${id}">Keep him</button><button class="lnk" data-act="player" data-id="${m.action.pid}">View player</button></div>`; }
  else if(m.action&&m.action.type==='player'){ act=`<div class="formrow"><button class="btn" data-act="player" data-id="${m.action.pid}">View player</button></div>`; }

  save();
}

function stepModal(k){
  const s=S();
  if(k==='coaches'){
    const opts=[['attack','Attacking coach','Forwards and attacking midfielders develop faster.'],['defence','Defensive coach','Defenders, holding midfielders and keepers develop faster.'],['youth','Youth development coach','Under-21s improve much faster.'],['fitness','Fitness coach','Players recover from matches quicker.']];
    openModal(`<div class="msg"><h2>Hire coaches</h2><p class="sub">Choose two.</p><div class="pick2">${opts.map(([v,t,d])=>`<label class="opt"><input type="checkbox" name="coach" value="${v}" ${s.coaches.includes(v)?'checked':''}><b>${t}</b><span>${d}</span></label>`).join('')}</div><button class="btn primary" data-act="saveCoaches">Hire</button><div id="mres" class="mres"></div></div>`);
  } else if(k==='media'){
    openModal(`<div class="msg presser"><p class="md">Press conference · ${esc(club(s.club).std)}</p><h2>"What are your ambitions for this season?"</h2><div class="pick2">
      <button class="opt" data-act="media" data-v="bold"><b>"We're here to win trophies."</b><span>Fans love it. The board will hold you to it.</span></button>
      <button class="opt" data-act="media" data-v="measured"><b>"We'll build something that lasts."</b><span>Calm and sensible. The board approves.</span></button>
      <button class="opt" data-act="media" data-v="humble"><b>"One game at a time."</b><span>Low expectations. Fans want more.</span></button></div></div>`);
  } else if(k==='plan'){ closeModal(); tab='tactics'; renderHub();
  } else if(k==='scout'){
    openModal(`<div class="msg"><h2>Scouting network</h2><p class="sub">Your scouts will report on players from this region. Premier League players are always visible.</p><div class="pick2">${Object.keys(E.REGIONS).map(r=>`<button class="opt" data-act="scoutRegion" data-v="${esc(r)}"><b>${esc(r)}</b><span>${esc(E.REGIONS[r].slice(0,4).join(', '))}${E.REGIONS[r].length>4?'…':''}</span></button>`).join('')}</div></div>`);
  } else if(k==='objectives'){
    const o=s.objective;
    openModal(`<div class="msg"><h2>Board objectives</h2><ul class="notes"><li><b>League:</b> ${esc(o.label)}.</li><li><b>Finance:</b> stay within your wage budget of £${s.wageBudget}k a week.</li><li><b>Youth:</b> give minutes to players aged 21 or under.</li><li><b>Transfers:</b> £${s.budget[s.club]}m to spend. Unused money stays with the club.</li></ul><button class="btn primary" data-act="acceptObj">Accept objectives</button></div>`);
  }
}

// ---------------- MATCH ----------------
// Continue: move the calendar on a day at a time, stopping whenever something needs the manager
// (bids, replies, scouting reports, board and player messages), and only then going to the match.
function continueDays(){
  const s=S(); const st=E.advanceStep();
  if(st.r==='blocked'){ toast('Finish your pre-season checklist first.',1); return; }
  if(st.r==='end'||st.r==='sacked'){ save(); renderHub(); return; }
  if(st.r==='event'){
    save(); renderHub();
    const msgs=st.stops.map(id=>s.inbox.find(m=>m.id===id)).filter(Boolean);
    toast(`${st.days===1?'Next day':st.days+' days later'} · ${E.fmtDate(s.date)}${msgs.length>1?` · ${msgs.length} new messages`:''}`);
    if(msgs[0]){ msgModal(msgs[0].id); rerenderBehind(); }
    return;
  }
  startMatchDay();
}
function startMatchDay(){
  const s=S();
  const f=E.nextUserFixture();
  const m=E.simMatch(f,E.setupFor(f));
  m.added=2+Math.floor(Math.random()*6);
  live={m, f, us: f.h===s.club?0:1, timer:null, paused:true, shown:0};
  save();
  renderPreMatch();
}
function lineupBoard(side){
  const m=live.m; const st=side?m.setup.a:m.setup.h; const c=side?m.a:m.h; const co=E.COORDS[st.formation]; const slots=E.FORMATIONS[st.formation];
  return `<div class="lu" style="--c1:${club(c).col};--c2:${club(c).col2}"><div class="luh">${chip(c)} <b>${esc(club(c).name)}</b><span>${st.formation} · ${esc(st.style)}</span></div><div class="pitch">${slots.map((sl,i)=>{const p=st.xi[i]&&E.P(st.xi[i]); return p?`<div class="dot" style="left:${side?100-co[i][0]:co[i][0]}%;bottom:${co[i][1]}%"><span class="dr ${ratingClass(E.ovr(p))}">${E.ovr(p)}</span><span class="dn">${esc(p.n)}</span></div>`:''}).join('')}</div><p class="lub">Bench: ${st.bench.slice(0,9).map(id=>esc(E.P(id).n)).join(', ')}</p></div>`;
}
function renderPreMatch(){
  const m=live.m, f=live.f; const s=S();
  app.innerHTML=`<section class="matchday">
    <div class="mhead"><div class="mt1">${chip(m.h)} <b>${esc(club(m.h).name)}</b> <span>vs</span> <b>${esc(club(m.a).name)}</b> ${chip(m.a)}</div>
    <div class="mt2">${esc(m.venue)} · ${f.t} · Referee: ${esc(m.ref)} · ${esc(m.weather)} · ${esc(fxLabel(f))}</div></div>
    <div class="lus">${lineupBoard(0)}${lineupBoard(1)}</div>
    <div class="formrow center"><button class="btn" data-act="toTactics">Change team</button><button class="btn primary big" data-act="kickoff">Kick off ▶</button><button class="btn" data-act="simMatch">Quick result</button></div>
  </section>`;
}
function renderLive(){
  const m=live.m; const us=live.us; const s=S();
  const st=(a,b,l,fmt)=>{const t=(a+b)||1; return `<div class="sbar"><span>${fmt?fmt(a):a}</span><div><i style="width:${a/t*100}%"></i></div><span>${fmt?fmt(b):b}</span><em>${l}</em></div>`;};
  app.innerHTML=`<section class="matchday live">
   <div class="score" style="--h1:${club(m.h).col};--h2:${club(m.h).col2};--a1:${club(m.a).col};--a2:${club(m.a).col2}">
     <div class="sh"><b>${esc(E.shortName(m.h))}</b></div><div class="sc"><span id="hg">${m.hg}</span><i>–</i><span id="ag">${m.ag}</span></div><div class="sa"><b>${esc(E.shortName(m.a))}</b></div>
     <div class="clock" id="clock">${m.min}'</div>
   </div>
   <div class="mgrid">
     <div class="comm" id="comm" aria-live="polite">${m.ev.slice().reverse().map(evHtml).join('')}</div>
     <div class="side">
       <div class="panel stats" id="stats">${st(m.poss,100-m.poss,'Possession',x=>x+'%')}${st(m.shots[0],m.shots[1],'Shots')}${st(m.sot[0],m.sot[1],'On target')}${st(Math.round(m.xg[0]*100)/100,Math.round(m.xg[1]*100)/100,'xG',x=>x.toFixed(2))}${st(m.yc[0],m.yc[1],'Yellow cards')}</div>
       <div class="panel ctrl">
         ${m.done?`<button class="btn primary big" data-act="fullTime">Full-time report ▶</button>`:`
         <div class="formrow"><button class="btn ${live.paused?'primary':''}" data-act="playPause">${live.paused?(m.min===0?'Kick off ▶':'Resume ▶'):'Pause ❚❚'}</button><button class="btn" data-act="skipEnd">Skip to end ⏭</button></div>
         <div class="formrow"><span class="sub">Speed</span>${[[1,'1×'],[2,'2×'],[4,'4×']].map(([v,l])=>`<button class="seg${s.matchSpeed==v?' on':''}" data-act="lspeed" data-v="${v}">${l}</button>`).join('')}</div>
         <div class="formrow"><span class="sub">Mentality</span>${[[2,'Defend'],[0,'Balanced'],[1,'Attack']].map(([v,l])=>`<button class="seg${m.mentality[us]==v?' on':''}" data-act="mental" data-v="${v}">${l}</button>`).join('')}</div>
         <button class="btn" data-act="subsOpen">Substitutions (${E.RULES.subs-m.subs[us]} left)</button>`}
       </div>
     </div>
   </div></section>`;
}
function evHtml(e){ return `<div class="ev t-${e.t} ${e.side===live.us?'us':e.side===-1?'nt':'them'}"><span class="em">${e.min}'</span><p>${esc(e.text)}</p></div>`; }
function tick(){
  if(!live||live.paused) return; const m=live.m; const s=S();
  E.aiSubs(m,1-live.us); E.aiMentality(m,live.us);
  const out=E.stepMinute(m);
  // auto pause at HT and at big moments? keep flowing; pause at HT
  const comm=$('#comm');
  if(comm){ out.forEach(e=>comm.insertAdjacentHTML('afterbegin',evHtml(e))); $('#clock').textContent=m.min+"'"; $('#hg').textContent=m.hg; $('#ag').textContent=m.ag; if(out.some(e=>e.t==='goal')) flashGoal(); }
  if(m.min%5===0||out.length) { const st=$('#stats'); if(st){ /* refresh stats lightly */ renderStatsOnly(); } }
  const injured=E.onPitch(m,live.us).find(p=>m.ratings[p.id].injured&&!m.ratings[p.id].told);
  if(injured){ m.ratings[injured.id].told=1; pauseLive(); renderLive(); toast(`${injured.n} is injured. Make a substitution.`,1); return; }
  if(m.min===45||m.done){ pauseLive(); renderLive(); return; }
  live.timer=setTimeout(tick, Math.round(520/(s.matchSpeed||2)));
}
function renderStatsOnly(){ const m=live.m; const el=$('#stats'); if(!el) return; const st=(a,b,l,fmt)=>{const t=(a+b)||1; return `<div class="sbar"><span>${fmt?fmt(a):a}</span><div><i style="width:${a/t*100}%"></i></div><span>${fmt?fmt(b):b}</span><em>${l}</em></div>`;}; el.innerHTML=`${st(m.poss,100-m.poss,'Possession',x=>x+'%')}${st(m.shots[0],m.shots[1],'Shots')}${st(m.sot[0],m.sot[1],'On target')}${st(Math.round(m.xg[0]*100)/100,Math.round(m.xg[1]*100)/100,'xG',x=>x.toFixed(2))}${st(m.yc[0],m.yc[1],'Yellow cards')}`; }
function flashGoal(){ const sc=document.querySelector('.score'); if(!sc) return; sc.classList.remove('goal'); void sc.offsetWidth; sc.classList.add('goal'); }
function pauseLive(){ if(!live) return; live.paused=true; clearTimeout(live.timer); }
function playLive(){ if(!live) return; live.paused=false; renderLive(); live.timer=setTimeout(tick,200); }
function subsModal(){
  const m=live.m, us=live.us; const st=us?m.setup.a:m.setup.h;
  const on=E.onPitch(m,us); const bench=st.bench.map(E.P).filter(p=>!m.ratings[p.id]);
  openModal(`<div class="msg subs"><h2>Substitution</h2><p class="sub">${E.RULES.subs-m.subs[us]} of ${E.RULES.subs} left. Pick who comes off, then who comes on.</p>
  <div class="subcols"><div><h3>Off</h3><ul class="plist">${on.map(p=>`<li><button data-act="subOff" data-id="${p.id}"><span class="pos p-${E.GROUP[E.slotOf(m,us,p.id)]}">${E.slotOf(m,us,p.id)}</span><b>${esc(p.n)}</b><span class="dim">${m.ratings[p.id].r.toFixed(1)}${m.ratings[p.id].injured?' 🚑':''}${m.ratings[p.id].yc?' 🟨':''}</span></button></li>`).join('')}</ul></div>
  <div><h3>On</h3><ul class="plist">${bench.map(p=>`<li><button data-act="subOn" data-id="${p.id}"><span class="pos p-${E.GROUP[p.p]}">${p.p}</span><b>${esc(p.n)}</b><span class="ovr ${ratingClass(E.ovr(p))}">${E.ovr(p)}</span></button></li>`).join('')}</ul></div></div><div id="mres" class="mres"></div></div>`,'wide');
}
let subPick={off:null,on:null};
function tryDoSub(){ if(subPick.off&&subPick.on){ const ok=E.makeSub(live.m,live.us,subPick.off,subPick.on); subPick={off:null,on:null}; closeModal(); renderLive(); if(!ok) toast('No substitutions left.',1); } else { const r=$('#mres'); if(r) r.textContent=subPick.off?'Now pick who comes on.':'Now pick who comes off.'; } }
function fullTime(){
  pauseLive(); const m=live.m; E.finalize(m); E.afterUserMatchDay(); save();
  const day=S().fixtures.filter(f=>f.d===live.f.d&&f.played&&f.i!==live.f.i);
  const rows=side=>{ const c=side?m.a:m.h; return Object.keys(m.ratings).map(Number).filter(id=>E.P(id).c===c||(side?m.setup.a:m.setup.h).xi.includes(id)).map(id=>[E.P(id),m.ratings[id]]).sort((a,b)=>b[1].final-a[1].final).map(([p,r])=>`<tr class="${m.motm===p.id?'motm':''}"><td>${esc(p.n)}${r.g?' '+'⚽'.repeat(r.g):''}${r.a?' 🅰️':''}${m.motm===p.id?' ★':''}</td><td class="num"><span class="mr ${r.final>=7.5?'hi':r.final<6?'lo':''}">${r.final.toFixed(1)}</span></td></tr>`).join(''); };
  const us=live.us; const won=(us?m.ag-m.hg:m.hg-m.ag);
  app.innerHTML=`<section class="matchday ft"><div class="score small ${won>0?'win':won<0?'loss':''}" style="--h1:${club(m.h).col};--h2:${club(m.h).col2};--a1:${club(m.a).col};--a2:${club(m.a).col2}"><div class="sh"><b>${esc(E.shortName(m.h))}</b></div><div class="sc"><span>${m.hg}</span><i>–</i><span>${m.ag}</span></div><div class="sa"><b>${esc(E.shortName(m.a))}</b></div><div class="clock">FT</div></div>
  <p class="scorers">${m.scorers.map(x=>`${esc(E.P(x.id).n)} ${x.min}'`).join(' · ')||'No goals'}</p>
  <div class="mgrid two"><div class="panel"><div class="ph"><h2>${esc(E.shortName(m.h))} ratings</h2></div><table class="tbl mini">${rows(0)}</table></div><div class="panel"><div class="ph"><h2>${esc(E.shortName(m.a))} ratings</h2></div><table class="tbl mini">${rows(1)}</table></div>
  <div class="panel"><div class="ph"><h2>Other results</h2></div>${day.length?`<ul class="results">${day.map(f=>`<li><b>${esc(E.shortName(f.h))} ${f.hg}–${f.ag} ${esc(E.shortName(f.a))}</b></li>`).join('')}</ul>`:'<p class="empty">No other games today.</p>'}</div></div>
  <div class="formrow center"><button class="btn primary big" data-act="backHub">Back to the club ▶</button></div></section>`;
  live=null;
}

// ---------------- EVENTS ----------------
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if (t.getAttribute('aria-disabled')==='true' && !['continue'].includes(t.dataset.act)) return;
  const a=t.dataset.act, s=S();
  const res=(r)=>{ const el=$('#mres'); if(el){ el.textContent=r.msg; el.className='mres '+(r.ok?'ok':'bad'); } else toast(r.msg,!r.ok); };
  switch(a){
    case 'title': pauseLive(); live=null; closeModal(); renderTitle(); break;
    case 'new': pending={}; renderEras(); break;
    case 'intl': toast('International mode is planned for a later version.'); break;
    case 'challenges': loadEra('2022-23').then(ok=>{ if(ok) renderChallenges(); }); break;
    case 'pickChallenge': { const c=CHALLENGES.find(x=>x.id===t.dataset.id); pending={club:c.club,challenge:c}; renderManager(); break; }
    case 'load': refreshMetas().then(()=>renderSlots('load')); break;
    case 'eras': renderEras(); break;
    case 'era22': loadEra('2022-23').then(ok=>{ if(ok) renderClubs(); }); break;
    case 'pickClub': pending.club=t.dataset.c; renderManager(); break;
    case 'startNew': { const n=($('#mname').value||'').trim(); if(!n){ toast('Type your manager name first.',1); $('#mname').focus(); return; } startGame(n,false); break; }
    case 'startReal': startGame(club(pending.club).mgr,true); break;
    case 'tab': tab=t.dataset.t; closeModal(); renderHub(); window.scrollTo(0,0); break;
    case 'continue': if(!E.onboardingDone()){ toast('Finish the pre-season checklist first.',1); tab='home'; renderHub(); return; } continueDays(); break;
    case 'continueSave': { const c=continueTarget(); if(c) loadSlot(c.slot); break; }
    case 'loadSlot': loadSlot(t.dataset.k); break;
    case 'delSlotAsk': { const k=t.dataset.k, m=metas[k]; openModal(`<div class="msg"><h2>Delete slot ${k}?</h2><p>${esc(metaLine(m))}</p><p class="sub">This can't be undone.</p><div class="formrow"><button class="btn danger" data-act="delSlot" data-k="${k}">Delete save</button><button class="btn" data-act="closeModal">Keep it</button></div></div>`); break; }
    case 'delSlot': { const k=t.dataset.k; Store.del(k).then(async()=>{ delete metas[k]; if(metas.auto&&String(metas.auto.forSlot)===String(k)){ await Store.del('auto'); delete metas.auto; } closeModal(); renderSlots('load'); toast('Save deleted'); }); break; }
    case 'exitAsk': if(live){ return; } exitModal(); break;
    case 'exitNoSave': leaveWithoutSaving(); break;
    case 'exitSave': { if(!curSlot){ closeModal(); renderSlots('save'); afterSave='title'; break; } saveToSlot(curSlot).then(ok=>{ if(!ok) return; E.S=null; curSlot=null; closeModal(); renderTitle(); toast('Career saved'); }); break; }
    case 'saveAs': closeModal(); afterSave='title'; renderSlots('save'); break;
    case 'saveSlotAsk': { const k=+t.dataset.k, m=metas[k]; if(m && k!==curSlot){ openModal(`<div class="msg"><h2>Overwrite slot ${k}?</h2><p>${esc(metaLine(m))}</p><p class="sub">That career will be replaced by this one.</p><div class="formrow"><button class="btn danger" data-act="saveSlot" data-k="${k}">Overwrite</button><button class="btn" data-act="closeModal">Cancel</button></div></div>`); } else doSaveSlot(k); break; }
    case 'saveSlot': closeModal(); doSaveSlot(+t.dataset.k); break;
    case 'newSlotAsk': { const k=+t.dataset.k, m=metas[k]; if(m){ openModal(`<div class="msg"><h2>Replace slot ${k}?</h2><p>${esc(metaLine(m))}</p><p class="sub">That career will be deleted to make room.</p><div class="formrow"><button class="btn danger" data-act="newSlot" data-k="${k}">Replace it</button><button class="btn" data-act="closeModal">Cancel</button></div></div>`); } else if(pendingStart) beginCareer(pendingStart.name,pendingStart.real,k); break; }
    case 'newSlot': closeModal(); if(pendingStart) beginCareer(pendingStart.name,pendingStart.real,+t.dataset.k); break;
    case 'scoutSend': { const r=E.scoutAssign($('#scg').value, +$('#sca').value); toast(r.msg,!r.ok); if(r.ok){ save(); renderHub(); } break; }
    case 'msgRenew': { const m=s.inbox.find(x=>x.id===+t.dataset.id); if(m){ m.done=true; renewModal(m.action.pid); } break; }
    case 'msgLoan': { const m=s.inbox.find(x=>x.id===+t.dataset.id); if(!m) break; const r=E.loanOut(m.action.pid); res(r); if(r.ok){ m.done=true; save(); setTimeout(()=>{closeModal();renderHub();},900);} break; }
    case 'msgKeep': { const m=s.inbox.find(x=>x.id===+t.dataset.id); if(!m) break; m.done=true; const p=E.P(m.action.pid); p.morale=Math.max(0,p.morale-8); save(); closeModal(); renderHub(); toast(`${p.n} stays. He's a bit disappointed.`); break; }
    case 'step': stepModal(t.dataset.k); break;
    case 'saveCoaches': { const v=[...document.querySelectorAll('input[name=coach]:checked')].map(x=>x.value); if(v.length!==2){ res({ok:false,msg:'Pick exactly two coaches.'}); return; } E.doCoaches(v); closeModal(); save(); renderHub(); toast('Coaches hired'); break; }
    case 'media': E.doMedia(t.dataset.v); closeModal(); save(); renderHub(); toast('Press conference done'); break;
    case 'scoutRegion': E.doScout(t.dataset.v); closeModal(); save(); renderHub(); toast('Scouts sent out'); break;
    case 'acceptObj': E.doObjectives(); closeModal(); save(); renderHub(); toast('Objectives accepted'); break;
    case 'confirmPlan': E.doPlan(s.formation,s.style); save(); renderHub(); toast('Gameplan confirmed'); break;
    case 'formation': s.formation=t.dataset.f; E.autoPick(); tacSel=null; renderHub(); break;
    case 'style': s.style=t.dataset.f; renderHub(); break;
    case 'autopick': E.autoPick(); tacSel=null; renderHub(); break;
    case 'autoxi': s.autoXI=t.checked; save(); break;
    case 'slot': { const i=+t.dataset.i; if(tacSel&&tacSel.type==='slot'){ const j=tacSel.i; [s.xi[i],s.xi[j]]=[s.xi[j],s.xi[i]]; tacSel=null; } else if(tacSel&&tacSel.type==='pl'){ swapIn(tacSel.id,i); tacSel=null; } else tacSel={type:'slot',i}; s.autoXI=false; renderHub(); break; }
    case 'tacPlayer': { const id=+t.dataset.id; if(tacSel&&tacSel.type==='slot'){ swapIn(id,tacSel.i); tacSel=null; s.autoXI=false; } else tacSel={type:'pl',id}; renderHub(); break; }
    case 'sortSquad': squadSort=t.dataset.k; renderHub(); break;
    case 'player': playerModal(+t.dataset.id); break;
    case 'closeModal': closeModal(); break;
    case 'openMsg': msgModal(+t.dataset.id); rerenderBehind(); break;
    case 'readAll': s.inbox.forEach(m=>m.read=true); renderHub(); break;
    case 'bid': { const fee=parseFloat($('#bidfee').value)||0; const r=E.makeBid(+t.dataset.id,fee,false); res(r); if(r.ok){ save(); setTimeout(()=>termsModal(r.offer.id),700); } else if(r.counter){ $('#bidfee').value=r.counter; } break; }
    case 'loanIn': { const r=E.makeBid(+t.dataset.id,0,true); res(r); if(r.ok){ save(); setTimeout(()=>termsModal(r.offer.id),700); } break; }
    case 'terms': termsModal(+t.dataset.id); break;
    case 'sendTerms': { const r=E.offerTerms(+t.dataset.id, parseInt($('#wage').value)||0, parseInt($('#yrs').value)||4); res(r); if(r.ok){ save(); setTimeout(()=>{closeModal(); renderHub();},900); } break; }
    case 'renewOpen': renewModal(+t.dataset.id); break;
    case 'sendRenew': { const r=E.renewContract(+t.dataset.id, parseInt($('#wage').value)||0, parseInt($('#yrs').value)||3); res(r); if(r.ok) save(); break; }
    case 'list': { const p=E.P(+t.dataset.id); E.listPlayer(p.id,!p.listed); save(); playerModal(p.id); break; }
    case 'loanOut': { const r=E.loanOut(+t.dataset.id); res(r); if(r.ok){ save(); setTimeout(()=>{closeModal();renderHub();},900);} break; }
    case 'releaseAsk': { const el=$('#mres'); el.innerHTML=`Release him? You'll pay up his contract. <button class="btn sm danger" data-act="release" data-id="${t.dataset.id}">Yes, release</button>`; break; }
    case 'release': { const r=E.releasePlayer(+t.dataset.id); save(); closeModal(); renderHub(); toast(r.msg); break; }
    case 'bidAccept': { const r=E.answerBid(+t.dataset.id,true); res(r); save(); setTimeout(()=>{closeModal();renderHub();},900); break; }
    case 'bidReject': { const r=E.answerBid(+t.dataset.id,false); res(r); save(); setTimeout(()=>{closeModal();renderHub();},700); break; }
    case 'bidCounter': { const r=E.answerBid(+t.dataset.id,false,parseFloat($('#counter').value)); res(r); save(); setTimeout(()=>{closeModal();renderHub();},1100); break; }
    case 'speed': s.matchSpeed=+t.dataset.v; save(); renderHub(); break;
    case 'saveNow': saveToSlot(curSlot||firstFreeSlot()||1).then(ok=>{ if(ok){ toast(`Saved to slot ${curSlot}`); renderHub(); } }); break;
    case 'saveAsHub': afterSave=null; renderSlots('save'); break;
    // match
    case 'toTactics': tab='tactics'; live=null; renderHub(); toast('Pick your team, then press Continue to come back to the match.'); break;
    case 'kickoff': playLive(); break;
    case 'simMatch': E.runToEnd(live.m, -1); fullTime(); break;
    case 'playPause': if(live.paused) playLive(); else { pauseLive(); renderLive(); } break;
    case 'skipEnd': pauseLive(); E.runToEnd(live.m, live.us); renderLive(); break;
    case 'lspeed': s.matchSpeed=+t.dataset.v; renderLive(); break;
    case 'mental': live.m.mentality[live.us]=+t.dataset.v; renderLive(); break;
    case 'subsOpen': pauseLive(); renderLive(); subPick={off:null,on:null}; subsModal(); break;
    case 'subOff': subPick.off=+t.dataset.id; t.classList.add('sel'); tryDoSub(); break;
    case 'subOn': subPick.on=+t.dataset.id; t.classList.add('sel'); tryDoSub(); break;
    case 'fullTime': fullTime(); break;
    case 'backHub': afterSave=null; tab='home'; renderHub(); break;
  }
});
function rerenderBehind(){ const v=$('#view'); if(v && tab==='home'){ v.innerHTML=renderTab(); } }
function swapIn(pid,slot){ const s=S(); const p=E.P(pid); if(p.inj||p.ban||p.loan){ toast(`${p.n} isn't available.`,1); return; } const cur=s.xi.indexOf(pid); if(cur>=0){ [s.xi[cur],s.xi[slot]]=[s.xi[slot],s.xi[cur]]; } else { const out=s.xi[slot]; s.xi[slot]=pid; s.bench=s.bench.filter(x=>x!==pid); if(out) s.bench.unshift(out); } }
document.addEventListener('change', e=>{
  const t=e.target; if(!t.dataset) return;
  if(t.dataset.act==='tfset'){ const k=t.dataset.k; tfFilter[k]= (k==='maxAge'||k==='maxVal')? +t.value : t.value; renderHub(); }
});
document.addEventListener('input', e=>{ const t=e.target; if(t.dataset&&t.dataset.act==='tfq'){ tfFilter.q=t.value; clearTimeout(window._tfq); window._tfq=setTimeout(()=>{ renderHub(); const i=$('#tfq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },250); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.matches('tr[data-act]')) e.target.click();
});
function bindTabKeys(){
  document.onkeydown2=null;
}
document.addEventListener('keydown', e=>{
  if(!S()||live||document.querySelector('.modal')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  const i=TABS.findIndex(x=>x[0]===tab);
  if(e.key==='q'||e.key==='Q'){ tab=TABS[(i+TABS.length-1)%TABS.length][0]; renderHub(); }
  if(e.key==='e'||e.key==='E'){ tab=TABS[(i+1)%TABS.length][0]; renderHub(); }
});

// boot
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(()=>({save:S(), tab, slot:curSlot}));
function start(data){ if(data&&data.save){ loadEra(eraId(data.save.era||'2022/23')).then(ok=>{ if(!ok) return boot(); E.S=E.migrate(data.save); tab=data.tab||'home'; curSlot=data.slot||null; refreshMetas().then(renderHub); }); } else boot(); }
if (hot && hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
</script>
